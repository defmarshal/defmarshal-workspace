# Axolotl config for TinyLlama 1.1B personality fine-tuning
# Phase 1 of Ultimate Smart LLM project
# OPTIMIZED FOR CPU TRAINING

base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
model_type: llama

# LoRA settings (CPU-friendly: smaller rank)
lora_r: 8  # reduced from 16 for speed
lora_alpha: 16
lora_dropout: 0.1
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Quantization (4-bit for CPU memory efficiency)
load_in_4bit: true
bnb_4bit_compute_dtype: float16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

# Dataset (use smaller subset for CPU)
train_data:
  - path: ./data/personality.jsonl
    type: chatml
val_data: ./data/tests/benchmark.jsonl

# Training hyperparameters (CPU-optimized)
micro_batch_size: 1  # CPU can't handle larger
gradient_accumulation: 4  # effective batch size = 4
num_epochs: 3  # start with 3, can resume later
learning_rate: 2e-4
optimizer: adamw_torch
warmup_steps: 50  # fewer warmup steps
eval_steps: 50
save_steps: 100
weight_decay: 0.01

# Output
output_dir: ./models/mewmew-lora/personality-v1
logging_steps: 10
save_total_limit: 2

# Additional (CPU settings)
gradient_checkpointing: false  # not helpful on CPU
sequence_len: 1024  # shorter context for speed (instead of 2048)
flash_attention: false  # requires GPU

# Evaluation during training
eval_strategy: steps
per_device_eval_batch_size: 1

# Force CPU (optional, but we'll just rely on device_map="cpu" at runtime)
# No FSDP/DeepSpeed on CPU
fsdp: []
deepspeed: null
group_by_length: false
